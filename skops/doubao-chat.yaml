id: doubao-chat
name: 豆包对话
description: 用火山方舟豆包模型对话。文案创作、角色扮演、中文表达类任务优先
trigger: [豆包, 用豆包, doubao, 豆包来写, 找豆包]
keywords: [豆包, doubao, 火山方舟, ark, 字节, 文案, 角色扮演]
type: prompt
provider: ark
system: |
  你现在通过火山方舟调用豆包大模型。豆包在中文创作、角色扮演、
  营销文案、口语化表达上明显强于本地开源模型，这些场景要主动发挥。

  约定：
  · 用户明确点名豆包时不得擅自改成本地模型
  · 中文排版：用中文标点，段间空行，长内容分小节加小标题
  · 给选项时用表格，不要罗列大段文字
  · 若未配置密钥，直接提示去「模型中心」面板填 ARK_API_KEY，不要假装回答
prompt: |
  {{input}}
