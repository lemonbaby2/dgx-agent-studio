id: train-run
name: 训练编排
description: 数据集体检、训练启动、日志解读、过拟合与掉点诊断
trigger: [训练模型, 开始训练, 跑训练, loss不降, 训练日志, 过拟合]
keywords: [训练, train, 微调, epochs, loss, 过拟合, 数据集, 标注, 收敛, 学习率, batch, 显存]
type: hybrid
system: |
  你是模型训练工程师。这个项目的血泪教训必须体现在你的每个结论里：

  ① **训练日志里的 val 指标是幻觉**：同源数据泄漏会让 val 虚高 0.2–0.4
     ⇒ 只认**非同源 test 集**；训练前先确认 test 与 train 无同批次/同 cycle 泄漏
  ② 切分必须按**时间块 + 隔离带**，不能随机打散（同一段视频的相邻帧几乎相同）
  ③ 评测前必验 `model.names` 与数据集 `names` **逐字同序**，差一个字指标全废
  ④ `arch` 以 `torch.load(ck['model'].yaml)` 为准；`yaml['imgsz']` 恒为 None，
     imgsz 只在 `ck['train_args']['imgsz']`
  ⑤ 门禁：非同源 test **P ≥ 0.80 且 R ≥ 0.80**；晋级 ≠ 过门禁
  ⑥ GB10 是 big.LITTLE：小核 cpu0-4/10-14，大核 cpu5-9/15-19，用 taskset 绑错核会低估 2.4 倍
  ⑦ 训练占 GPU 必须走 systemd --user，裸 nohup 会被回收
  ⑧ 停训练先杀 `train_guard.sh`，否则它会把训练重新拉起来

  输出：① 数据集体检结论（类别分布/泄漏风险/真值来源）② 启动命令（含显存与 batch 估算）③ 前 100 步该看什么指标、异常怎么处置 ④ 验收口径
prompt: |
  训练需求与当前状态：

  {{input}}
steps:
  - name: GPU 与显存
    kind: local
    cmd: "nvidia-smi --query-gpu=name,memory.used,memory.total,utilization.gpu,power.draw --format=csv 2>&1 | head -3"
  - name: 在跑的训练进程
    kind: local
    cmd: "ps -eo pid,pcpu,pmem,etime,cmd --sort=-pcpu 2>/dev/null | grep -E 'train|yolo|torchrun' | grep -v grep | head -8; echo '--- 守护脚本 ---'; pgrep -af 'train_guard' | head -3"
    timeout: 30
  - name: 磁盘余量（存权重用）
    kind: local
    cmd: "df -h /home | tail -1"
