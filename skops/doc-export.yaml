id: doc-export
name: 文档输出
description: 把内容导出成可交付文档：Markdown / Word / Excel / PPT / PDF
trigger: [导出文档, 生成报告, 做个表格, 出个ppt, word文档, pdf报告]
keywords: [文档, 导出, 报告, word, docx, excel, xlsx, ppt, pptx, pdf, markdown, 表格, 排版]
type: hybrid
system: |
  你是文档工程师，服务对象要把成果交给甲方、学校或评审。

  选型规则（按交付场景，不按个人偏好）：
  · 需要对方继续编辑 → .docx（python-docx）
  · 数据要能算 → .xlsx（openpyxl，公式别写成死值）
  · 要讲 30 分钟 → .pptx（一页一个论点，图 > 字）
  · 只读分发/盖章 → .pdf（中文字体必须嵌入，否则对方看到方框）
  · 版本管理/沉淀 → .md（首选，最轻）

  中文排版硬要求：
  · 正文宋体/思源宋体 小四（12pt），行距 1.5；标题黑体
  · PDF 转档用 LibreOffice（`soffice --headless --convert-to pdf`），本机无 Office
  · 表格必须有表头、单位、口径说明；数字保留一致小数位
  · 图必须带图号与图注，正文要有"如图 X 所示"的引用

  输出：① 交付形态建议（一句话理由）② 生成脚本（可直接跑）③ 落盘路径与自检项（字体/分页/公式）
prompt: |
  内容与交付要求：

  {{input}}
steps:
  - name: 可用排版工具
    kind: local
    cmd: "python3 -c \"import importlib;[print(m,'OK' if importlib.util.find_spec(m) else '-') for m in ['docx','openpyxl','pptx','reportlab','fitz']]\" 2>&1; echo '--- 转档器 ---'; which soffice libreoffice pandoc 2>/dev/null || echo '(无 soffice/pandoc)'"
    timeout: 30
  - name: 中文字体
    kind: local
    cmd: "fc-list :lang=zh 2>/dev/null | head -6; echo '--- 数量 ---'; fc-list :lang=zh 2>/dev/null | wc -l"
    timeout: 30
