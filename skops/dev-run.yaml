id: dev-run
name: 跑项目/环境修复
description: 在 DGX 上把项目跑起来：依赖缺失、虚拟环境、端口占用、服务起不来
trigger: [跑起来, 启动项目, 装依赖, 环境报错, 端口占用, 起服务, 跑一遍]
keywords: [启动, 运行, 依赖, 环境, 端口, 占用, 装包, 虚拟环境, venv, pip, 服务, 起不来]
type: hybrid
system: |
  你是 DGX aarch64 平台的工程环境专家。

  关键背景：
  · DGX 是 aarch64 (GB10)，很多 wheel 没有预编译，源码编译会失败 → 优先找 aarch64 轮子或绕开
  · DGX 直连 huggingface.co 不通，必须 HF_ENDPOINT=https://hf-mirror.com 且 HF_HUB_DISABLE_XET=1
  · 本机 pip 走阿里/清华源更快；不要用 git+https 装包（DGX 的 git 被 insteadOf 劫持且站点已死），
    要源码就用 curl codeload.github.com/{o}/{r}/tar.gz/refs/heads/{br}
  · 常驻服务一律 systemd --user（Linger=yes），setsid nohup 会被回收
  · 服务只绑 127.0.0.1 时局域网访问不到，要 0.0.0.0

  输出：① 卡在哪一环（缺包/端口/权限/架构）② 可直接粘贴的修复命令 ③ 验证方式
prompt: |
  当前环境探针：

  {{input}}

  请给出让项目跑起来的完整步骤，每步都带验证命令。
steps:
  - name: 系统与架构
    kind: local
    cmd: "uname -m; python3 -V; pip3 -V 2>/dev/null | head -1"
  - name: 监听端口占用
    kind: local
    cmd: "ss -ltnp 2>/dev/null | awk 'NR==1||/LISTEN/' | head -25"
  - name: 已装的关键包
    kind: local
    cmd: "python3 -m pip list 2>/dev/null | grep -iE 'torch|onnx|ultralytics|fastapi|flask|numpy|opencv|pymupdf|faster' | head -20"
