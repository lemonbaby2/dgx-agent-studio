<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGX Agent Studio</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/v8.css">
<link rel="stylesheet" href="/v16.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233b6ef5'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='Segoe UI' font-weight='bold'>D</text></svg>">
</head>
<body>

<div id="app">

  <!-- ==================== 左侧边栏 ==================== -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logo">D</div>
      <div class="brand-text">
        <div class="brand-name">DGX Agent Studio</div>
        <div class="brand-sub" id="brand-sub">dgx-host · 本地多模型</div>
      </div>
    </div>

    <button class="btn-new" id="btn-new">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建对话
    </button>

    <nav class="nav" id="nav">
      <div class="nav-item active" data-view="chat">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>对话</span>
      </div>
      <div class="nav-item" data-view="files">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span>本地文件夹</span>
      </div>
      <div class="nav-item" data-view="models">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>
        <span>模型管理</span>
      </div>
      <div class="nav-item" id="nav-skills" data-view="skills" title="打开技能库（全部技能收在这里）">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        <span>技能库</span>
      </div>
      <div class="nav-item nav-v8" data-view="embodied">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v1H8a3 3 0 0 0-3 3v2H4a2 2 0 0 0 0 4h1v2a3 3 0 0 0 3 3h1v1a3 3 0 0 0 6 0v-1h1a3 3 0 0 0 3-3v-2h1a2 2 0 0 0 0-4h-1V9a3 3 0 0 0-3-3h-1V5a3 3 0 0 0-3-3z"/></svg>
        <span>具身仿真</span>
      </div>
      <div class="nav-item nav-v8" data-view="paper">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7M9 11h7M9 15h4"/></svg>
        <span>论文朗读</span>
      </div>
      <div class="nav-item nav-v8" data-view="notes">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        <span>笔记仓库</span>
      </div>
      <div class="nav-item nav-v8" data-view="learn">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"/><path d="M21 3v6h-6"/><path d="M12 8v4l3 2"/></svg>
        <span>自我进化</span>
      </div>
      <div class="nav-item nav-v8" data-view="hub">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M7 21h10M12 17v4M8 8h4M8 11.5h6"/></svg>
        <span>模型中心</span>
      </div>
      <div class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>设置</span>
      </div>
    </nav>

    <div class="sess-head">
      <span>会话记录</span>
      <span class="sess-count" id="sess-count">0</span>
    </div>
    <div class="sess-list" id="sess-list"></div>

    <div class="side-foot">
      <div class="conn" id="conn">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-text">连接中…</span>
      </div>
      <div class="ver" id="ver-text">v5.0</div>
    </div>
  </aside>

  <!-- ==================== 主区 ==================== -->
  <main id="main">

    <!-- 顶栏 -->
    <header id="topbar">
      <div class="tb-left">
        <select id="sel-model" class="sel" title="选择模型">
          <option>加载中…</option>
        </select>
        <span class="model-tags" id="model-tags"></span>
      </div>
      <div class="tb-right">
        <select id="sel-base" class="sel sel-sm" title="服务地址"></select>
        <button class="tbtn" id="btn-refresh" title="刷新模型列表">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button class="tbtn" id="btn-toggle-think" title="显示思维链">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1M6.343 6.343l-.707-.707M17.657 6.343l.707-.707M3 12h1M20 12h1"/><path d="M12 21a6 6 0 0 0 6-6c0-3-2-4.5-3-6-1-1.5-1.5-3-1.5-3s-.5 1.5-1.5 3c-1 1.5-3 3-3 6a6 6 0 0 0 6 6z" stroke-width="0" fill="currentColor"/></svg>
          思维链
        </button>
        <button class="tbtn" id="btn-skills" title="技能库（全部技能）">⚡</button>
        <button class="tbtn" id="btn-panel" title="折叠文件面板">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>
        </button>
        <button class="tbtn" id="btn-clear" title="清空当前会话">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </header>

    <!-- 对话区 -->
    <section id="chat-wrap">
      <div id="chat"></div>
      <div id="empty">
        <div class="empty-logo">D</div>
        <div class="empty-title">你好，我是 DGX 智能体</div>
        <div class="empty-sub">左侧「本地文件夹」可以挂载你的项目目录，@ 引用文件后直接提问</div>
        <div class="sugg" id="sugg"></div>
      </div>
    </section>

    <!-- 输入区 -->
    <footer id="composer">
      <div id="skill-bar" class="skill-bar"></div>
      <div id="ref-chips"></div>
      <div class="input-card">
        <textarea id="input" rows="1" placeholder="给 DGX 发送消息（Enter 发送，Shift+Enter 换行）"></textarea>
        <div class="input-foot">
          <div class="foot-left">
            <button class="ibtn" id="btn-img" title="上传图片（发给视觉模型）">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
              图片
            </button>
            <button class="ibtn" id="btn-file" title="引用本地文件到对话">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              引用文件
            </button>
            <button class="ibtn ibtn-toggle" id="btn-think2" title="深度思考（显示 R1 思维链）">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-4 12.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26A7 7 0 0 0 12 2zM9 22h6"/></svg>
              深度思考
            </button>
            <button class="ibtn ibtn-toggle on" id="btn-agent" title="自主执行：智能体自动调用工具干活（查状态/读写文件/跑命令/搜索），不只是回答">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
              自主执行
            </button>
          </div>
          <div class="foot-right">
            <span class="hint" id="send-hint">Enter 发送</span>
            <button class="btn-stop" id="btn-stop" hidden>停止</button>
            <button class="btn-send" id="btn-send" title="发送">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="composer-foot">
        <span id="status-text">就绪</span>
        <span class="spacer"></span>
        <span id="model-status" class="ms"></span>
      </div>
    </footer>
  </main>

  <!-- ==================== v8 工作台（具身仿真 / 论文朗读 / 笔记仓库） ==================== -->
  <section id="v8-view" hidden>
    <div class="v8-head">
      <div class="v8-title" id="v8-title">具身仿真</div>
      <div class="v8-sub" id="v8-sub"></div>
      <span class="spacer"></span>
      <button class="v8-btn" id="v8-refresh">刷新状态</button>
    </div>
    <div class="v8-body" id="v8-body"></div>
  </section>

  <!-- ==================== 右侧文件面板 ==================== -->
  <aside id="panel" class="open">
    <div class="panel-tabs">
      <div class="ptab active" data-tab="tree">文件夹</div>
      <div class="ptab" data-tab="preview">预览</div>
      <button class="panel-close" id="panel-close" title="收起面板">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <div class="ptab-body" data-tab="tree">
      <div class="ws-bar">
        <button class="ws-add" id="ws-add" title="添加本地目录">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          添加目录
        </button>
        <input id="ws-search" class="ws-search" placeholder="搜索文件名…">
      </div>
      <div class="ws-list" id="ws-list"></div>
      <div class="tree" id="tree"></div>
    </div>

    <div class="ptab-body" data-tab="preview" hidden>
      <div class="pv-head" id="pv-head"></div>
      <div class="pv-body" id="pv-body"></div>
    </div>
  </aside>

  <!-- 添加目录弹层 -->
  <div class="modal-mask" id="modal-ws" hidden>
    <div class="modal">
      <div class="modal-title">添加本地文件夹</div>
      <div class="modal-sub">添加后即可浏览该目录、引用文件到对话。软件只访问你在这里添加过的目录。</div>
      <input id="ws-path" class="modal-input" placeholder="例如 D:\SOP项目  或  E:\实时某地sop">
      <div class="modal-quick" id="ws-quick"></div>
      <div class="modal-foot">
        <button class="btn ghost" id="ws-cancel">取消</button>
        <button class="btn primary" id="ws-ok">添加</button>
      </div>
    </div>
  </div>

  <!-- 设置弹层 -->
  <div class="modal-mask" id="modal-cfg" hidden>
    <div class="modal">
      <div class="modal-title">设置</div>
      <div class="cfg-row">
        <label>服务地址</label>
        <select id="cfg-base" class="sel"></select>
      </div>
      <div class="cfg-row">
        <label>默认模型</label>
        <select id="cfg-model" class="sel"></select>
      </div>
      <div class="cfg-row">
        <label>温度 <span id="cfg-temp-v" class="mono">0.7</span></label>
        <input id="cfg-temp" type="range" min="0" max="1.5" step="0.05" value="0.7">
      </div>
      <div class="cfg-row">
        <label>系统提示词</label>
        <textarea id="cfg-system" rows="4"></textarea>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" id="cfg-cancel">关闭</button>
        <button class="btn primary" id="cfg-save">保存</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-img" accept="image/*" multiple hidden>
  <input type="file" id="file-any" multiple hidden>
</div>

<div id="toast"></div>
<script src="/app.js"></script>
<script src="/panel.js"></script>
<script src="/v14multi.js"></script>
<script src="/v6ui.js"></script>
<script src="/v16skills.js"></script>
<script src="/v7voice.js"></script>
<script src="/v8ui.js"></script>
<script src="/v9user.js"></script>
<script src="/v17update.js"></script>

  <!-- ==================== v16：技能库抽屉 ==================== -->
  <div id="sk-drawer" class="sk-drawer" hidden>
    <div class="sk-mask" id="sk-mask"></div>
    <aside class="sk-panel" role="dialog" aria-label="技能库">
      <div class="sk-head">
        <div class="sk-title">⚡ 技能库 <span class="sk-count" id="sk-count">0</span></div>
        <button class="sk-close" id="sk-close" title="关闭（Esc）">×</button>
      </div>
      <input id="sk-search" class="sk-search" placeholder="搜索技能名 / 关键词，回车选中第一个">
      <div class="sk-tabs" id="sk-tabs"></div>
      <div class="sk-body" id="sk-body"></div>
      <div class="sk-foot">点一下填入输入框 → 补要求 → 回车执行　·　也可直接输入 <code>/技能id</code></div>
    </aside>
  </div>

</body>
</html>
